<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mulawin FleetOps — Head Management Wireframe</title><style>
:root{--bg:#f3f6f4;--surface:#fff;--line:#dce7df;--ink:#21382f;--muted:#71887b;--green:#216849;--pale:#e7f1eb;--warning:#a66b13;--red:#bd4038;--blue:#3267a7;--shadow:0 12px 32px #173e291e}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:220px;min-width:220px;background:#fff;border-right:1px solid var(--line);padding:17px 10px;position:sticky;height:100vh;top:0;overflow:auto}.logo{font-size:17px;font-weight:800;letter-spacing:.2px;padding:4px 12px 22px;line-height:1.12}.logo em{font-style:normal;color:var(--green)}.logo small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;color:#829b8d;padding:13px 12px 7px}.nav{border:0;width:100%;background:none;text-align:left;display:flex;align-items:center;gap:11px;padding:12px;border-radius:10px;color:#426054;font-weight:600;margin:2px 0}.nav:hover,.nav.active{background:var(--pale);color:var(--green)}.nav .ico{width:21px;text-align:center;font-size:16px}.sidebar-note{margin:20px 10px;padding:12px;background:#f5f8f6;border:1px solid var(--line);border-radius:10px;font-size:11px;color:var(--muted)}.main{min-width:0;flex:1}.top{height:60px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 22px;background:#fff;gap:10px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink)}.profile{display:flex;align-items:center;gap:12px;font-size:12px}.avatar{width:32px;height:32px;background:var(--pale);color:var(--green);display:grid;place-items:center;border-radius:50%;font-weight:800}.content{padding:24px;max-width:1900px;margin:0 auto}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.head h1{font-size:25px;letter-spacing:-.6px;margin:0 0 3px}.sub{margin:0;color:var(--muted);font-size:13px}.top-actions,.actions,.filters,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{background:white;border:1px solid #cfdfd5;color:#32624c;border-radius:8px;padding:8px 11px;font-weight:650;font-size:12px}.btn:hover{background:#eef5f0}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.primary:hover{background:#175438}.btn.small{padding:5px 8px;font-size:11px}.btn.ghost{border:0;background:transparent}.btn.danger{color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0}.kpi,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.kpi{padding:15px 16px;min-height:113px;display:block;text-align:left;color:inherit;width:100%}.kpi:hover,.clickrow:hover{border-color:#b1d0bd;background:#fbfdfb}.kpi .lbl{font-size:12px;color:var(--muted)}.kpi .num{font-size:27px;font-weight:800;margin-top:4px;letter-spacing:-.5px}.kpi .hint{font-size:11px;color:var(--muted)}.kpi .num.warn{color:var(--warning)}.kpi .num.alert{color:var(--red)}.section{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-top:13px}.panel{padding:15px;min-width:0}.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}.ptitle h2{font-size:14px;margin:0}.ptitle a,.link{color:var(--green);font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}.compactlist{max-height:258px;overflow:auto}.clickrow{border:0;border-bottom:1px solid #edf0ee;background:transparent;width:100%;padding:12px 0;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;color:inherit}.clickrow:last-child{border-bottom:0}.titlecell{font-weight:700;font-size:12px}.smallmuted{font-size:11px;color:var(--muted);margin-top:3px}.pill{border-radius:6px;background:#e8f1fd;color:#3267a7;padding:4px 7px;font-size:10px;font-weight:800;white-space:nowrap}.pill.warn{background:#fff2d9;color:#98610d}.pill.red{background:#ffebeb;color:#ac3d36}.pill.ok{background:#e8f5ed;color:#216d46}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.tab{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#5e796a;font-size:12px;font-weight:650}.tab.on{color:var(--green);background:var(--pale);border-color:#bfdbc9}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:740px}th{text-align:left;font-size:12px;color:#62796b;font-weight:700;background:#f8faf8}td,th{padding:10px 9px;border-bottom:1px solid #edf1ee;white-space:nowrap}td{font-size:12px}tr:last-child td{border-bottom:0}.table-panel{padding:0;overflow:hidden}.table-bar{padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.field{background:#fff;border:1px solid #d2dfd5;border-radius:8px;padding:9px 10px;color:var(--ink);min-width:140px}.field.search{min-width:235px}.mosaic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.smallpanel{min-height:125px}.statline{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #edf1ee}.statline:last-child{border:0}.statline strong{font-size:17px}.bars{display:flex;align-items:flex-end;gap:9px;height:175px;margin:12px 6px 0;padding-bottom:22px;border-bottom:1px solid #dce7df;position:relative}.bar-group{flex:1;display:flex;gap:4px;align-items:flex-end;height:100%;position:relative}.bar{flex:1;min-height:3px;border-radius:4px 4px 0 0;background:#3a926b}.bar.alt{background:#adcdb8}.bar-label{position:absolute;bottom:-20px;width:100%;text-align:center;font-size:10px;color:var(--muted)}.legend{font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;background:#3a926b;border-radius:3px;margin:0 4px 0 12px}.dot.alt{background:#adcdb8}.empty{padding:23px;text-align:center;color:var(--muted)}.overlay{position:fixed;inset:0;background:#10261d54;display:none;z-index:20}.overlay.show{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(510px,100%);background:#fff;z-index:21;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s;display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawtop{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:12px}.drawtop h2{margin:0;font-size:20px}.drawbody{padding:20px 22px;overflow:auto;flex:1}.drawbottom{border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:flex-end;gap:8px}.details{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}.details dt{font-size:11px;color:var(--muted)}.details dd{font-size:13px;font-weight:700;margin:3px 0 0}.notice{border:1px solid #e5dcc0;background:#fffaf0;padding:11px;border-radius:8px;font-size:12px;color:#765b2b}.audit{border-left:2px solid #b7d8c2;padding:0 0 14px 15px;margin-left:6px}.audit strong{font-size:12px}.audit p{font-size:11px;color:var(--muted);margin:3px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:50;background:#173f2c;color:#fff;padding:11px 16px;border-radius:9px;box-shadow:var(--shadow);display:none;font-size:12px}.chip{background:#f2f6f3;padding:8px 11px;border-radius:8px;font-size:12px}.hidden{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #77b999;outline-offset:2px}@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.section,.mosaic{grid-template-columns:1fr 1fr}}@media(max-width:740px){.sidebar{width:64px;min-width:64px;padding:10px 6px}.logo{font-size:12px;padding:8px 2px 14px}.logo small,.nav-label,.nav span:not(.ico),.sidebar-note{display:none}.nav{justify-content:center;padding:12px 4px}.content{padding:15px}.top{padding:0 12px}.profile .role-name{display:none}.head{flex-direction:column}.section,.mosaic{grid-template-columns:1fr}.kpis{gap:8px}.kpi{padding:12px}.kpi .num{font-size:23px}.field.search{min-width:160px}.details{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><em>◈</em> MULAWIN<small>FleetOps · Head Management</small></div><div class="nav-label">Management</div><div id="nav"></div><div class="sidebar-note">INTERACTIVE WIREFRAME<br>Illustrative records only. No real approvals, payments, or user changes are performed.</div></aside><main class="main"><div class="top"><div class="crumb">Head Management &nbsp; › &nbsp; <strong id="crumb">Overview</strong></div><div class="profile"><span class="role-name">Admin / Head Management</span><div class="avatar">HM</div><button class="btn ghost" onclick="openDrawer('profile')">⌄</button></div></div><div class="content" id="content"></div></main></div><div class="overlay" id="overlay" onclick="closeDrawer()"></div><aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Record details"><div class="drawtop"><div><div class="smallmuted" id="drawtype"></div><h2 id="drawtitle"></h2></div><button class="btn" onclick="closeDrawer()" aria-label="Close details">✕</button></div><div class="drawbody" id="drawbody"></div><div class="drawbottom" id="drawactions"></div></aside><div class="toast" id="toast"></div>
<script>
const sections=[['overview','◫','Overview'],['approvals','✓','Approvals'],['operations','▣','Operations'],['maintenance','⚒','Maintenance'],['purchasing','▤','Purchasing'],['finance','₱','Financial Oversight'],['reports','▥','Executive Reports'],['users','♙','Users & Roles'],['audit','◷','Audit Trail']];
const approvals=[{id:'APR-1042',kind:'Purchase Order',ref:'PO-2026-0008',owner:'Purchasing',amount:'₱28,400',date:'Nov 12, 2026',status:'Pending',note:'Awaiting Head Management review of procurement request.'},{id:'APR-1041',kind:'Expense Request',ref:'EX-2026-021',owner:'Finance',amount:'₱12,500',date:'Nov 11, 2026',status:'Pending',note:'Supporting expense records require review.'},{id:'APR-1040',kind:'Repair Authorization',ref:'RP-2026-0074',owner:'Motorpool',amount:'₱7,800',date:'Nov 11, 2026',status:'Pending',note:'Approval step shown as a concept only; use it only if this permission exists in the real system.'},{id:'APR-1039',kind:'Purchase Order',ref:'PO-2026-0007',owner:'Purchasing',amount:'₱9,200',date:'Nov 10, 2026',status:'Reviewed',note:'Example previously reviewed record.'}];
const departments=[{id:'operations',name:'Operations',desc:'Trips, dispatch and fleet activity',items:[['Trips requiring review','3'],['Active trips','8'],['Pending trip completion','2']]},{id:'maintenance',name:'Motorpool',desc:'Repairs and mechanic workload',items:[['Open repair jobs','6'],['Awaiting verification','1'],['Pending parts requests','3']]},{id:'purchasing',name:'Purchasing',desc:'Procurement, inventory and supply',items:[['Pending parts requests','2'],['Open purchase orders','2'],['Low stock items','3']]},{id:'finance',name:'Accounting',desc:'Payments, receivables and budget visibility',items:[['Items awaiting review','4'],['Unsettled obligations','2'],['Collection follow-ups','3']]}];
const users=[{name:'Purchasing Officer',user:'purchasing.demo',role:'Purchasing',status:'Active'},{name:'Motorpool Supervisor',user:'motorpool.demo',role:'Motorpool',status:'Active'},{name:'Finance Reviewer',user:'finance.demo',role:'Finance',status:'Active'},{name:'Billing Staff',user:'billing.demo',role:'Billing',status:'Active'},{name:'Audit Reviewer',user:'audit.demo',role:'Audit',status:'Active'}];
const audit=[['Nov 12, 2026 · 10:25 AM','Purchase order submitted for approval','Purchasing Officer','PO-2026-0008'],['Nov 12, 2026 · 09:40 AM','Repair status updated','Motorpool Supervisor','RP-2026-0074'],['Nov 11, 2026 · 04:15 PM','Inventory received','Purchasing Officer','PO-2026-0004'],['Nov 11, 2026 · 02:02 PM','Finance request reviewed','Finance Reviewer','EX-2026-021']];
let page='overview',tab='All',search='',selectedReport='Month',approvedState={};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function navTo(p){page=p;tab='All';search='';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('crumb').textContent=sections.find(x=>x[0]===p)?.[2]||'Overview';closeDrawer();render();window.scrollTo({top:0,behavior:'instant'});}function init(){ $('nav').innerHTML=sections.map(([id,ico,name])=>`<button data-page="${id}" class="nav ${id==='overview'?'active':''}" title="${name}" onclick="navTo('${id}')"><span class="ico">${ico}</span><span>${name}</span></button>`).join('');render();}function header(t,sub,actions=''){return `<div class="head"><div><h1>${t}</h1><p class="sub">${sub}</p></div><div class="top-actions">${actions}</div></div>`}function kpi(label,value,hint,target,tone=''){return `<button class="kpi" onclick="${target}"><div class="lbl">${label} ↗</div><div class="num ${tone}">${value}</div><div class="hint">${hint}</div></button>`}function panel(title,body,link='',act=''){return `<section class="panel"><div class="ptitle"><h2>${title}</h2>${link?`<a tabindex="0" role="button" onclick="${act}" onkeydown="if(event.key==='Enter')${act}">${link} →</a>`:''}</div>${body}</section>`}function item(title,desc,badge,onClick,badgeTone=''){return `<button class="clickrow" onclick="${onClick}"><div><div class="titlecell">${title}</div><div class="smallmuted">${desc}</div></div>${badge?`<span class="pill ${badgeTone}">${badge}</span>`:''}</button>`}function tabs(names){return `<div class="pills">${names.map(n=>`<button class="tab ${tab===n?'on':''}" onclick="tab=${JSON.stringify(n)};render()">${n}</button>`).join('')}</div>`}function filt(hint='Search records...'){return `<input id="search" class="field search" type="search" placeholder="${hint}" value="${esc(search)}" oninput="search=this.value;filterTable()"/>`}function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody id="tbody">${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">No matching sample records.</td></tr>`}</tbody></table></div>`}function row(cells){return `<tr data-filter="${esc(cells.map(x=>x.replace(/<[^>]*>/g,'')).join(' ').toLowerCase())}">${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`}function filterTable(){document.querySelectorAll('#tbody tr').forEach(r=>r.style.display=r.dataset.filter?.includes(search.toLowerCase())?'':'none')}
function overview(){return header('Head Management Overview','Cross-department visibility and decisions requiring management attention.',`<button class="btn" onclick="navTo('reports')">Executive Reports</button><button class="btn primary" onclick="navTo('approvals')">Review Approvals</button>`)+`<div class="kpis">${kpi('Awaiting Approval','3','Pending items in approval queue',"navTo('approvals')",'warn')}${kpi('Open Repairs','6','Motorpool snapshot',"navTo('maintenance')")}${kpi('Low Stock Items','3','Purchasing inventory alerts',"navTo('purchasing')",'alert')}${kpi('Department Updates','4','Functional monitoring areas',"navTo('operations')")}</div><div class="section">${panel('Needs Management Attention',`<div class="compactlist">${approvals.filter(a=>a.status==='Pending').map(a=>item(a.ref+' · '+a.kind,a.owner+' · '+a.amount,'Review',`openDrawer('${a.id}')`,'warn')).join('')}</div>`,'See all',"navTo('approvals')")}${panel('Department Pulse',`<div class="compactlist">${departments.map(d=>item(d.name,d.desc,d.items[0][1]+' flagged',`navTo('${d.id}')`)).join('')}</div>`,'View departments',"navTo('operations')")}</div><div class="section">${panel('Recent Management Activity',`<div class="compactlist">${audit.map(a=>item(a[1],a[0]+' · '+a[2],a[3],`openDrawer('audit:${a[3]}')`)).join('')}</div>`,'Audit trail',"navTo('audit')")}${panel('Shortcuts',`<div class="mosaic" style="grid-template-columns:repeat(2,minmax(0,1fr))">${[['Approvals','approvals'],['Financial oversight','finance'],['User access','users'],['Executive reports','reports']].map(x=>`<button class="btn" style="padding:20px 8px" onclick="navTo('${x[1]}')">${x[0]} →</button>`).join('')}</div><p class="smallmuted">Illustrative navigation. Actual access must follow backend permissions.</p>`)}</div>`}
function approvalPage(){let set=['All','Pending','Reviewed'];let arr=approvals.filter(a=>tab==='All'||(approvedState[a.id]||a.status)===tab);return header('Approvals','Review requests routed to Head Management by the existing authorization workflow.',`<button class="btn" onclick="openDrawer('approvalHelp')">Approval rules</button>`)+tabs(set)+`<section class="panel table-panel"><div class="table-bar"><strong>Approval Queue (${arr.length})</strong>${filt('Search reference or department')}</div>${table(['Reference','Request Type','Department','Amount','Submitted','Status','Action'],arr.map(a=>row([esc(a.ref),esc(a.kind),esc(a.owner),esc(a.amount),esc(a.date),`<span class="pill ${(approvedState[a.id]||a.status)==='Pending'?'warn':'ok'}">${approvedState[a.id]||a.status}</span>`,`<button class="btn small" onclick="openDrawer('${a.id}')">Review →</button>`])))}</section>`}
function deptPage(key){const d=departments.find(x=>x.id===key);const another=key==='maintenance'?[['Pending repair verification','1','Review repair details'],['Repair jobs needing parts','3','Inspect linked requests'],['Mechanic assignment alerts','2','Review staffing']]:key==='purchasing'?[['Low stock items','3','Open inventory'],['Pending purchase orders','2','Review orders'],['Parts requests to process','2','Open requests']]:key==='finance'?[['Approvals awaiting review','2','Review routed approvals'],['Collections to follow up','3','See billing summary'],['Payables requiring attention','2','See authorized payables']]:[['Dispatch exceptions','3','Review trip exceptions'],['Trips in progress','8','Open operational summary'],['Pending closures','2','Review status']];return header(d.name==='Accounting'?'Financial Oversight':d.name+' Monitoring',d.desc,`<button class="btn" onclick="navTo('overview')">← Overview</button>`)+`<div class="kpis">${d.items.map(([l,n])=>kpi(l,n,'Illustrative current snapshot',`openDrawer('dept:${key}:${l}')`)).join('')}${kpi('Reports','View','Management-level summary only',"navTo('reports')")}</div><div class="section">${panel('Needs Attention',`<div class="compactlist">${another.map(([l,n,help])=>item(l,help,n,`openDrawer('dept:${key}:${l}')`,'warn')).join('')}</div>`)}${panel('Department Overview',`<div class="compactlist">${d.items.map(([l,n])=>`<div class="statline"><span>${l}</span><strong>${n}</strong></div>`).join('')}</div><div class="notice" style="margin-top:13px">Head Management receives monitoring and exception details here. Operational edits remain in the corresponding authorized department workflow.</div>`)}</div>`}
function reportPage(){return header('Executive Reports','Consolidated monitoring across departments with drill-down to permitted records.',`<select class="field" onchange="selectedReport=this.value;render()"><option ${selectedReport==='Month'?'selected':''}>Month</option><option ${selectedReport==='Quarter'?'selected':''}>Quarter</option><option ${selectedReport==='Year'?'selected':''}>Year</option></select><button class="btn" onclick="openDrawer('export')">Export options</button>`)+`<div class="kpis">${kpi('Completed Trips','24','Within selected reporting period',"openDrawer('report:trips')")}${kpi('Repairs Completed','12','Within selected reporting period',"openDrawer('report:repairs')")}${kpi('Purchase Orders Approved','5','Within selected reporting period',"openDrawer('report:orders')")}${kpi('Management Exceptions','4','Items flagged for review',"openDrawer('report:exceptions')",'warn')}</div><div class="section">${panel('Department Activity',`<div class="legend"><span class="dot"></span>Recorded activity<span class="dot alt"></span>Completed/processed</div><div class="bars">${[['Operations',88,60],['Motorpool',64,47],['Purchasing',70,56],['Accounting',76,52]].map(([n,v,x])=>`<div class="bar-group"><div class="bar" style="height:${v}%"></div><div class="bar alt" style="height:${x}%"></div><div class="bar-label">${n}</div></div>`).join('')}</div><p class="smallmuted">Concept chart. The live implementation must use consistent actual metrics and period dates.</p>`)}${panel('Top Management Exceptions',`<div class="compactlist">${[['Procurement requests awaiting decisions','2','purchasing'],['Repairs waiting for verification','1','maintenance'],['Trip exceptions for follow-up','3','operations'],['Billing follow-ups','3','finance']].map(([l,n,target])=>item(l,'Open department view',n,`navTo('${target}')`,'warn')).join('')}</div>`)}</div>${panel('Financial & Operational Summary',`<div class="mosaic">${[['Purchasing commitments','PO records and approved values'],['Maintenance expenses','Actual repair-linked costs'],['Receivables','Authorized billing balances']].map(([n,d])=>`<button class="kpi smallpanel" onclick="openDrawer('report:${n}')"><div class="titlecell">${n} ↗</div><div class="smallmuted">${d}</div><div style="margin-top:16px;color:var(--muted)">View source breakdown →</div></button>`).join('')}</div><p class="smallmuted">No made-up totals or double counting across purchases, receipts, payments and expenses in the real app.</p>`)}`}
function usersPage(){return header('Users & Roles','View role assignments and access status. Changes require explicit confirmation and actual backend enforcement.',`<button class="btn primary" onclick="openDrawer('invite')">+ Add User (Prototype)</button>`)+`<section class="panel table-panel"><div class="table-bar"><strong>User Access</strong>${filt('Search users or roles')}</div>${table(['User','Username','Assigned Role','Status','Action'],users.map((u,i)=>row([esc(u.name),esc(u.user),esc(u.role),'<span class="pill ok">'+u.status+'</span>',`<button class="btn small" onclick="openDrawer('user:${i}')">View access →</button>`])))}</section><div class="section">${panel('Role Separation',`<div class="compactlist">${[['Motorpool','Repairs and mechanic workflows'],['Purchasing','Requests, POs and inventory'],['Accounting','Finance, Billing and Audit workspaces'],['Head Management','Authorized oversight and approvals']].map(([n,d])=>item(n,d,'Role',"openDrawer('roles')")).join('')}</div>`)}${panel('Access Principles',`<p>Keep permissions enforced on the backend—not only by hiding sidebar links.</p><p class="smallmuted">Account status, role changes and sensitive functions require auditing and confirmation.</p><button class="btn" onclick="openDrawer('roles')">View proposed access rules</button>`)}</div>`}
function auditPage(){return header('Audit Trail','Trace management-visible events, actors, timestamps and source references.',`<button class="btn" onclick="openDrawer('export')">Export options</button>`)+`<section class="panel table-panel"><div class="table-bar"><strong>Activity Log</strong>${filt('Search action or reference')}</div>${table(['Date / Time','Action','Actor','Reference','Details'],audit.map(a=>row([a[0],a[1],a[2],a[3],`<button class="btn small" onclick="openDrawer('audit:${a[3]}')">View →</button>`])))}</section>`}
function render(){let map={overview,approvals:approvalPage,operations:()=>deptPage('operations'),maintenance:()=>deptPage('maintenance'),purchasing:()=>deptPage('purchasing'),finance:()=>deptPage('finance'),reports:reportPage,users:usersPage,audit:auditPage};$('content').innerHTML=map[page]();filterTable()}
function openDrawer(id){let title='Details',type='HEAD MANAGEMENT',body='',actions=`<button class="btn" onclick="closeDrawer()">Close</button>`;let a=approvals.find(x=>x.id===id);if(a){title=a.ref;type=a.kind+' · '+a.id;body=`<div class="notice">Wireframe only. Real approve/reject controls must appear ONLY if the existing workflow assigns Head Management this decision.</div><dl class="details"><div><dt>Department</dt><dd>${a.owner}</dd></div><div><dt>Amount</dt><dd>${a.amount}</dd></div><div><dt>Submitted</dt><dd>${a.date}</dd></div><div><dt>Status</dt><dd>${approvedState[a.id]||a.status}</dd></div></dl><h3>Request Summary</h3><p>${a.note}</p><h3>Supporting Records</h3><div class="chip">Referenced record: ${a.ref}</div><p class="smallmuted">Attachments and approval history must be read from actual linked records in the live system.</p><h3>Decision History</h3><div class="audit"><strong>Submitted for review</strong><p>${a.date} · ${a.owner}</p></div>`;if((approvedState[a.id]||a.status)==='Pending')actions=`<button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn danger" onclick="demoDecision('${a.id}','Reviewed')">Request changes (demo)</button><button class="btn primary" onclick="demoDecision('${a.id}','Reviewed')">Mark reviewed (demo)</button>`}
else if(id.startsWith('user:')){let u=users[+id.split(':')[1]];title=u.name;type='USER ACCESS';body=`<dl class="details"><div><dt>Username</dt><dd>${u.user}</dd></div><div><dt>Role</dt><dd>${u.role}</dd></div><div><dt>Status</dt><dd>${u.status}</dd></div></dl><h3>Authorized Workspace</h3><p>${u.role} workspace and linked permissions.</p><div class="notice">This is a read-only design prototype. Editing users must use your existing user-management backend with proper audit records.</div>`;actions=`<button class="btn" onclick="closeDrawer()">Close</button><button class="btn primary" onclick="toast('Role edit preview only — no account changed.')">Edit access (demo)</button>`}
else if(id==='invite'){title='Add User';type='ACCESS MANAGEMENT';body=`<label>Name<br><input class="field" style="width:100%;margin:5px 0 14px" placeholder="Enter display name"></label><label>Role<br><select class="field" style="width:100%;margin:5px 0 14px"><option>Choose role</option><option>Motorpool</option><option>Purchasing</option><option>Finance</option><option>Billing</option><option>Audit</option></select></label><div class="notice">Prototype only. No credentials will be created.</div>`;actions=`<button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="toast('Preview only — no user created.')">Preview creation</button>`}
else if(id==='approvalHelp'){title='Approval Rules';body='<p>Head Management should only approve items that are actually routed to its authorized role by existing approval rules.</p><div class="notice">Do not add an approval step to purchases, repairs or payments just because it is shown in this conceptual wireframe.</div>'}
else if(id==='roles'){title='Role Separation';body='<p>Head Management: cross-department visibility to permitted summaries; authorized approvals and administration.</p><p>Motorpool, Purchasing and Accounting: retain their respective operational ownership.</p><div class="notice">Exact permissions and approval authority must be verified against the existing application.</div>'}
else if(id==='profile'){title='Account Menu';body='<div class="chip">My Profile</div><br><div class="chip">Account Settings</div><br><div class="chip">Password & Security</div><br><div class="chip">Log Out</div><p class="smallmuted">Menu layout only. Actual account management remains in the existing top navigation.</p>'}
else if(id==='export'){title='Export Reports';body='<p>Export only records and summaries authorized for the Head Management role.</p><div class="notice">Print/PDF/CSV actions are proposed controls only. No file or backend export is performed by this wireframe.</div>';actions=`<button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="toast('Export preview only — no file generated.')">Export preview</button>`}
else if(id.startsWith('audit:')){let ref=id.slice(6);title=ref;type='AUDIT EVENT';const r=audit.find(a=>a[3]===ref);body=`<dl class="details"><div><dt>Date and time</dt><dd>${r?.[0]||'Sample record'}</dd></div><div><dt>Actor</dt><dd>${r?.[2]||'Department user'}</dd></div><div><dt>Action</dt><dd>${r?.[1]||'Recorded event'}</dd></div><div><dt>Reference</dt><dd>${ref}</dd></div></dl><div class="notice">Actual before/after changes, IP metadata and document evidence should appear only when stored and authorized.</div>`}
else if(id.startsWith('dept:')){let x=id.split(':');title=x[2];type='DEPARTMENT EXCEPTION';body=`<p>Concept drill-down for ${x[1]}.</p><div class="notice">This must be linked to real filtered records in the live application, without fabricating statuses or workflow actions.</div>`}
else if(id.startsWith('report:')){title=id.slice(7);type='EXECUTIVE REPORT BREAKDOWN';body=`<h3>How this metric is calculated</h3><p>Show source records with dates, references and qualifying statuses.</p><h3>Included records</h3><div class="chip">Source-level breakdown from authorized transactions</div><p class="smallmuted">Illustrative summary only. No numeric financial values are invented for this prototype.</p>`}
else{title='Details';body='<p>Preview of the selected management record.</p>'}
$('drawtype').textContent=type;$('drawtitle').textContent=title;$('drawbody').innerHTML=body;$('drawactions').innerHTML=actions;$('overlay').classList.add('show');$('drawer').classList.add('open');}
function closeDrawer(){$('overlay').classList.remove('show');$('drawer').classList.remove('open')}function toast(m){$('toast').textContent=m;$('toast').style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>$('toast').style.display='none',2800)}function demoDecision(id,status){approvedState[id]=status;closeDrawer();render();toast('Prototype state updated locally. No real approval was made.')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});init();
</script></body></html>

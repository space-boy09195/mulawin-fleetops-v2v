<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MULAWIN FleetOps — Maintenance UI Reference</title><style>
:root{--accent:#216650;--dark:#174d3e;--bg:#f5f7f6;--line:#e3eae6;--muted:#687b73;--ink:#20342d}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Arial;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.notice{background:#eaf4ec;text-align:center;padding:9px;color:#2a6948;font-size:12px;border-bottom:1px solid #d1e8d6}.shell{display:flex;min-height:calc(100vh - 35px)}aside{width:213px;background:white;border-right:1px solid var(--line);padding:16px 10px;flex-shrink:0;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:6px 9px 20px}.logo{display:grid;place-items:center;background:var(--dark);color:white;border-radius:9px;width:34px;height:34px;font-weight:800}.brand b{display:block;letter-spacing:.7px}.brand small{font-size:11px;color:var(--muted)}.role{font-size:10px;color:#8ba094;font-weight:800;letter-spacing:1px;padding:0 12px 9px}.nav{display:grid;gap:3px}.nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:11px 10px;border-radius:8px;color:#55695e;font-size:13px}.nav button.active{background:#e9f4ed;color:#17663f;box-shadow:inset 3px 0 0 #25744f;font-weight:750}.nav button:hover:not(.active){background:#f3f7f4}.nav .sym{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;color:#8a9a90;font-size:11px;padding:15px 10px;border-top:1px solid var(--line)}main{flex:1;min-width:0}.top{height:58px;border-bottom:1px solid var(--line);background:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:10px}.crumb{color:#74867b;font-size:12px}.crumb strong{color:#30473c}.topright{display:flex;align-items:center;gap:8px}.container{padding:24px;max-width:1360px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:19px}.head h1{font-size:24px;letter-spacing:-.6px;margin:0 0 5px}.head p{font-size:13px;color:var(--muted);margin:0}.btn{border:1px solid #d6e2da;background:white;border-radius:8px;padding:9px 12px;color:#315b45;font-size:12px;font-weight:650}.btn:hover{background:#eaf5ed}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:19px}.kpi{background:white;border:1px solid var(--line);text-align:left;border-radius:11px;padding:16px;min-width:0}.kpi:hover{border-color:#9ac6a8}.klabel{color:#718579;font-size:12px}.knum{font-size:29px;font-weight:780;margin:8px 0 5px}.khint{color:#84968a;font-size:11px}.sect{font-size:13px;font-weight:750;margin:8px 0 11px}.quick{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}.two{display:grid;grid-template-columns:1.14fr 1fr;gap:14px}.stack{display:grid;align-content:start;gap:14px;min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;min-width:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.panelhead strong{font-size:14px}.textlink{border:0;background:transparent;color:#20714b;font-size:12px;font-weight:700}.scroll{max-height:210px;overflow:auto}.entry{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:11px 0;border-top:1px solid #eff3f0;cursor:pointer}.entry:first-child{border-top:0}.entry b{font-size:12px}.entry small{display:block;margin-top:4px;font-size:11px;color:#7c8d82}.chip{display:inline-block;font-size:10px;font-weight:750;border-radius:6px;background:#eaf4eb;color:#477557;padding:5px 7px;white-space:nowrap}.chip.warn{background:#fff2db;color:#91600b}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:15px 0}.field{padding:10px;border:1px solid #dbe5df;border-radius:8px;background:white;color:#30463a;font-size:13px}.search{flex:1;min-width:180px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tab{border:1px solid #d9e6dc;border-radius:7px;padding:8px 13px;background:#fff;color:#57705e;font-size:12px}.tab.active{background:#e7f4eb;color:#196841;border-color:#b0d8bb;font-weight:750}.tablebox{border:1px solid var(--line);border-radius:10px;background:white;overflow:auto}.datatable{border-collapse:collapse;width:max-content;min-width:100%;font-size:14px}.datatable th{text-align:left;font-size:13px;color:#65786d;background:#f9fbf9;padding:10px 8px;border-bottom:1px solid var(--line)}.datatable td{padding:11px 8px;border-bottom:1px solid #edf1ee}.datatable tr:last-child td{border:0}.datatable th:first-child,.datatable td:first-child{padding-left:14px}.datatable th:last-child,.datatable td:last-child{padding-right:14px}.datatable tr:hover td{background:#fbfdfb}.link{color:#207048;font-weight:700;cursor:pointer}.iconbtn{background:#fff;border:1px solid #dce6df;color:#256a49;border-radius:7px;width:32px;height:32px;margin-right:4px}.iconbtn:hover{background:#e9f4ec}.meta{font-size:11px;color:#839388;margin-top:12px}.chart{height:165px;display:flex;gap:15px;align-items:flex-end;padding:8px 5px 0}.barset{display:flex;align-items:end;justify-content:center;flex:1;gap:4px;height:100%;position:relative;padding-bottom:19px}.bar{background:#62a27b;border-radius:5px 5px 0 0;width:21px}.bar.alt{background:#b8d6c2}.barlabel{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:#859589}.rank{display:grid;grid-template-columns:minmax(78px,110px) 1fr 30px;gap:10px;align-items:center;font-size:12px;margin:17px 0}.track{height:10px;background:#e7f0ea;border-radius:9px;overflow:hidden}.fill{background:#549b74;height:100%;border-radius:9px}.tip{background:#ecf7ed;border:1px solid #cfe6d5;border-radius:9px;padding:12px;color:#315640;font-size:12px;margin:12px 0}.overlay{position:fixed;inset:0;background:#12291c66;display:flex;justify-content:flex-end;z-index:20}.drawer{background:white;width:min(400px,94vw);height:100%;padding:24px;overflow:auto;box-shadow:-10px 0 30px #192f2520}.drawerhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px}.drawerrow{padding:14px 0;border-bottom:1px solid #eef2ef}.drawerrow small{display:block;color:#809184;font-size:11px;margin-bottom:5px}.drawerrow strong{font-size:14px}.muted{color:#768a7c}.empty{text-align:center;color:#829587;padding:34px}.view{min-height:430px}@media(max-width:850px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.container{padding:16px}}@media(max-width:620px){aside{width:56px;padding:12px 4px}.brand{padding:5px 7px}.brand .words,.role,.nav .navtext,.sidefoot{display:none}.nav button{justify-content:center}.top{padding:0 10px}.head h1{font-size:20px}.topright .btn{padding:8px;font-size:10px}.grid4{gap:8px}.kpi{padding:12px}.knum{font-size:24px}.container{padding:12px}.two{gap:10px}}
</style></head><body><div class="notice">CLICKABLE REFERENCE ONLY — fictitious placeholders, no connection to mulawin_v2 and no real writes</div><div class="shell"><aside><div class="brand"><div class="logo">M</div><div class="words"><b>MULAWIN</b><small>FleetOps</small></div></div><div class="role" id="role"></div><nav class="nav" id="nav"></nav><div class="sidefoot">Standalone design reference</div></aside><main><header class="top"><div class="crumb" id="crumb"></div><div class="topright"><button class="btn" id="switch">⇄ Switch workspace</button><button class="btn" id="account">◉ Account ▾</button></div></header><div class="container view" id="view"></div></main></div><div id="modal"></div>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x);let workspace='Motorpool',page='Overview',status='All',search='',tip='';const navs={Motorpool:[['Overview','▦'],['Repair Management','⚒'],['Parts Requests','▤'],['Mechanic Masterlist','♙'],['Mechanic Attendance','◷'],['Maintenance History','◴'],['Reports','▥']],Purchasing:[['Overview','▦'],['Parts Requests','▤'],['Purchase Orders','🛒'],['Inventory','▣'],['Stock Movements','⇅'],['Reports','▥']]};const samples={'Repair Management':[['Repair A','Truck A','Under Repair','Motorpool'],['Repair B','Truck B','Waiting for Parts','Purchasing'],['Repair C','Truck C','For Verification','Motorpool']],'Parts Requests':[['Request A','Filter','Pending','Purchasing'],['Request B','Brake part','Partially Released','Purchasing']],'Purchase Orders':[['PO A','Sample supplier','Pending Approval','Finance'],['PO B','Sample supplier','For Receiving','Purchasing']],'Inventory':[['Item A','Filter','Low Stock','Review'],['Item B','Brake part','Available','—']],'Stock Movements':[['Movement A','Stock In','Recorded','Linked PO'],['Movement B','Stock Out','Recorded','Linked request']],'Mechanic Masterlist':[['Mechanic A','Mechanic','Active','Available'],['Mechanic B','Mechanic','Active','Busy']],'Mechanic Attendance':[['Mechanic A','Today','Timed In','On Duty'],['Mechanic B','Today','Timed In','Busy']],'Maintenance History':[['Repair D','Truck D','Completed','Verified']]};const descriptions={'Repair Management':'Track repairs, assign mechanics, and verify completed work.','Parts Requests':'Review requests and track parts availability.','Purchase Orders':'Follow approvals and received deliveries.','Inventory':'See current stock and item availability.','Stock Movements':'Review stock changes and their source transactions.','Reports':'Understand activity and the work needing attention.','Mechanic Masterlist':'Review mechanic availability.','Mechanic Attendance':'Monitor attendance and duty records.','Maintenance History':'Review completed repairs.'};function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tag(s){return '<span class="chip '+(/pending|waiting|low|partially/i.test(s)?'warn':'')+'">'+html(s)+'</span>'}function header(t,d,action=''){return `<div class="head"><div><h1>${html(t)}</h1><p>${html(d)}</p></div>${action?`<button class="btn primary" data-action="${html(action)}">＋ ${html(action)}</button>`:''}</div>`}function kpi(label,sub,go){return `<button class="kpi" data-go="${go}"><div class="klabel">${label} ↗</div><div class="knum">—</div><div class="khint">${sub}</div></button>`}function entry(label,sub,flag,target){return `<div class="entry" data-go="${target}"><div><b>${label}</b><small>${sub}</small></div>${tag(flag)}</div>`}function panel(title,rows,go){return `<section class="panel"><div class="panelhead"><strong>${title}</strong><button class="textlink" data-go="${go}">See all →</button></div><div class="scroll">${rows}</div></section>`}function overview(){let m=workspace==='Motorpool';const cards=m?[['Open Repairs','Current workload','Repair Management'],['Waiting for Parts','Outstanding requirements','Parts Requests'],['For Verification','Ready for review','Repair Management'],['Mechanics on Duty','Attendance records','Mechanic Attendance']]:[['Pending Requests','Need processing','Parts Requests'],['Orders to Receive','Awaiting deliveries','Purchase Orders'],['Low Stock Items','Needs review','Inventory'],['Open Orders','Approval and delivery','Purchase Orders']];let left1=m?entry('Repair awaiting parts','Waiting on Purchasing','Waiting','Parts Requests')+entry('Repair for verification','Check completed work','Review','Repair Management'):entry('Request awaiting review','Check available inventory','Pending','Parts Requests')+entry('PO to receive','Check delivered items','Pending','Purchase Orders');let left2=m?entry('Inspection recorded','Recent job update','Updated','Maintenance History')+entry('Mechanic assigned','Repair activity','Updated','Repair Management'):entry('Stock released','Recorded movement','Updated','Stock Movements')+entry('PO updated','Receiving progress','Updated','Purchase Orders');let right1=m?panel('Mechanic Status',entry('Available Mechanics','Duty records','Available','Mechanic Attendance')+entry('Assigned Mechanics','Active repair jobs','Busy','Mechanic Masterlist'),'Mechanic Masterlist'):panel('Purchase Order Status',entry('Pending Approval','Requires authorized review','Finance','Purchase Orders')+entry('Awaiting Delivery','Receiving needed','Purchasing','Purchase Orders'),'Purchase Orders');let right2=m?panel('Trucks in Repair',entry('Open repair jobs','View affected trucks','Active','Repair Management')+entry('Waiting for Parts','Outstanding parts','Waiting','Parts Requests'),'Repair Management'):panel('Inventory Alerts',entry('Low stock','Review replenishment','Review','Inventory')+entry('Outstanding shortage','Unreleased requested parts','Pending','Parts Requests'),'Inventory');return header(workspace+' Overview',m?'Monitor repairs, mechanics and trucks in service.':'Monitor requests, purchase orders and inventory.')+`<div class="grid4">${cards.map(x=>kpi(...x)).join('')}</div><div class="sect">Quick Actions</div><div class="quick">${(m?['Repair Management','Parts Requests','Mechanic Attendance']:['Parts Requests','Purchase Orders','Inventory']).map(p=>`<button class="btn" data-go="${p}">↗ ${p}</button>`).join('')}</div><div class="two"><div class="stack">${panel('Needs Attention',left1,m?'Repair Management':'Parts Requests')}${panel('Recent '+(m?'Maintenance':'Purchasing')+' Activity',left2,m?'Maintenance History':'Stock Movements')}</div><div class="stack">${right1}${right2}</div></div>`}function list(){let rows=samples[page]||[],opts=page==='Repair Management'?['All','Under Repair','Waiting for Parts','For Verification']:page==='Inventory'?['All','Low Stock','Available']:page==='Purchase Orders'?['All','Pending Approval','For Receiving']:['All','Pending','Completed'];let filtered=rows.filter(r=>(status==='All'||r[2]===status)&&r.join(' ').toLowerCase().includes(search.toLowerCase()));return header(page,descriptions[page]||'Review relevant records.')+`<div class="tabs">${opts.map(o=>`<button class="tab ${status===o?'active':''}" data-status="${o}">${o}</button>`).join('')}</div><div class="toolbar"><input class="field search" id="search" placeholder="Search records..." value="${html(search)}"><button class="btn" id="reset">Reset</button></div><div class="tablebox"><table class="datatable"><thead><tr><th>Reference</th><th>Description</th><th>Status</th><th>${/Movements|History|Masterlist/.test(page)?'Details':'Waiting For'}</th><th>Actions</th></tr></thead><tbody>${filtered.map((r,i)=>`<tr><td><span class="link" data-record="${r[0]}">${r[0]}</span></td><td>${r[1]}</td><td>${tag(r[2])}</td><td>${r[3]}</td><td><button class="iconbtn" data-action="${page==='Stock Movements'?'Open linked PO':page==='Repair Management'?'Next step':'Process'}" data-id="${r[0]}" aria-label="Contextual action" title="Contextual action">↗</button><button class="iconbtn" data-record="${r[0]}" aria-label="Details" title="Details">⌕</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching sample records</td></tr>'}</tbody></table></div><p class="meta">Fictitious sample rows. Real implementation must use actual authorized repository records.</p>`}function chart(dual){return `<div class="chart">${[37,66,48,82].map((v,i)=>`<div class="barset"><div class="bar" style="height:${v}%"></div>${dual?`<div class="bar alt" style="height:${Math.max(12,v-19)}%"></div>`:''}<span class="barlabel">Week ${i+1}</span></div>`).join('')}</div>`}function ranks(names){return names.map((n,i)=>`<div class="rank"><b>${n}</b><div class="track"><div class="fill" style="width:${[84,61,35][i]}%"></div></div><span>—</span></div>`).join('')}function reports(){let m=workspace==='Motorpool',k=m?[['Completed Repairs','Recorded jobs'],['Ongoing Repairs','Current workload'],['Total Downtime','Recorded periods'],['Maintenance Cost','Recorded expenses']]:[['Inventory Value','Recorded costs'],['Low Stock Items','Stock review'],['Parts Released','Stock out'],['Pending Orders','Open purchase orders']];return header(m?'Maintenance Reports':'Purchasing Reports',m?'Repairs, downtime and maintenance spending.':'Stock, parts consumption and purchasing activity.')+`<div class="toolbar"><label>Reporting period <select class="field" aria-label="Reporting period"><option>This month</option><option>Last 3 months</option><option>Last 6 months</option></select></label></div><div class="grid4">${k.map(x=>`<div class="kpi"><div class="klabel">${x[0]}</div><div class="knum">—</div><div class="khint">${x[1]}</div></div>`).join('')}</div><div class="two"><div class="panel"><div class="panelhead"><strong>${m?'Repair Activity Trend':'Stock In vs Stock Out'}</strong><button class="textlink" data-tip="trend" title="Suggested action">💡 Suggestion</button></div>${chart(!m)}<p class="meta">Demonstration chart shapes; no real measured values.</p></div><div class="panel"><div class="panelhead"><strong>${m?'Trucks Requiring Attention':'Most Used Parts'}</strong><button class="textlink" data-tip="rank" title="Suggested action">💡 Suggestion</button></div>${ranks(m?['Truck A','Truck B','Truck C']:['Filter','Brake part','Air system'])}<p class="meta">Fictitious labels; not actual ranked data.</p></div></div><div id="tipplace"></div><div class="panel" style="margin-top:14px"><div class="panelhead"><strong>${m?'Maintenance Expense Summary':'Orders & Stock Summary'}</strong><button class="textlink" data-go="${m?'Maintenance History':'Purchase Orders'}">Open records →</button></div><div class="muted">${m?'Supported parts, labor and repair expense summaries.':'Pending purchases and outstanding stock needs.'}</div></div>`}function render(){const nav=navs[workspace];$('role').textContent=workspace==='Motorpool'?'MAINTENANCE':'PURCHASING';$('nav').innerHTML=nav.map(([n,s])=>`<button data-go="${n}" class="${page===n?'active':''}"><span class="sym">${s}</span><span class="navtext">${n}</span></button>`).join('');$('crumb').innerHTML=workspace+' / <strong>'+page+'</strong>';$('view').innerHTML=page==='Overview'?overview():page==='Reports'?reports():list()}function close(){$('modal').innerHTML=''}function go(p){if(!navs[workspace].some(x=>x[0]===p))return;page=p;status='All';search='';tip='';close();render()}function drawer(t,body){$('modal').innerHTML=`<div class="overlay" id="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${html(t)}"><div class="drawerhead"><strong>${html(t)}</strong><button class="btn" id="close">✕</button></div>${body}</section></div>`}function record(id){let r=(samples[page]||[]).find(x=>x[0]===id)||[id,'Sample record','Unknown','—'];drawer('Record Details',`<div class="drawerrow"><small>Reference</small><strong>${html(r[0])}</strong></div><div class="drawerrow"><small>Description</small><strong>${html(r[1])}</strong></div><div class="drawerrow"><small>Status</small><strong>${html(r[2])}</strong></div><div class="drawerrow"><small>Waiting For / Detail</small><strong>${html(r[3])}</strong></div><div class="tip">Real app: show only authorized, existing details, linked records and history.</div><button class="btn" id="close2">Close</button>`)}function action(kind,id){if(kind==='Open linked PO'){go('Purchase Orders');drawer('Linked Purchase Order',`<p class="tip">This illustrates cross-page navigation. The drawer should close when navigating away, and not reappear on unrelated pages.</p><p class="muted">${html(id||'')}</p><button class="btn" id="close2">Close</button>`);return}drawer(kind,`<p class="tip">Interaction preview only; no database writes occur.</p><div class="drawerrow"><small>Selected record</small><strong>${html(id||'New record')}</strong></div><label class="muted" style="display:block;margin:15px 0">Notes <input class="field" style="display:block;width:100%;margin-top:6px" placeholder="Example only"></label><button class="btn primary" id="preview">Preview action</button>`)}document.body.addEventListener('click',e=>{let n=e.target.closest('[data-go]');if(n){go(n.dataset.go);return}if(e.target.closest('#switch')){workspace=workspace==='Motorpool'?'Purchasing':'Motorpool';go('Overview');return}if(e.target.closest('#account')){drawer('Account Settings','<p class="muted">The live app keeps its existing account menu in the top navigation.</p>');return}let t=e.target.closest('[data-status]');if(t){status=t.dataset.status;render();return}let a=e.target.closest('[data-action]');if(a){action(a.dataset.action,a.dataset.id);return}let r=e.target.closest('[data-record]');if(r){record(r.dataset.record);return}let tip=e.target.closest('[data-tip]');if(tip){const spot=$('tipplace');if(spot){const msg=workspace==='Motorpool'?(tip.dataset.tip==='rank'?'Review trucks with recurring maintenance issues.':'Review periods with high recorded repair activity.'):(tip.dataset.tip==='rank'?'Review frequently used parts for replenishment.':'Review outstanding stock movements and requests.');spot.innerHTML=spot.innerHTML?'':`<div class="tip"><strong>💡 Suggested action</strong><div>${msg}</div><small>Illustrative text, not a real detected issue.</small></div>`}return}if(e.target.closest('#reset')){status='All';search='';render();return}if(e.target.closest('#close')||e.target.closest('#close2')||e.target.id==='overlay'){close();return}if(e.target.closest('#preview')){drawer('Action Preview','<div class="tip">No write is performed by this reference prototype.</div><button class="btn" id="close2">Close</button>')}});document.body.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const at=e.target.selectionStart;render();let i=$('search');i.focus();i.setSelectionRange(at,at)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render()})();
</script></body></html>

<script>
// Mocked API contract tests; real database integration lives in operations_v43_tests.php.
(async()=>{

 window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));

 const logo=UI.logoTag;UI.logoTag=(...args)=>logo(...args).replace('src="assets/','src="../public/assets/');UI.toast=()=>{};UI.result=()=>{};App.route=async()=>{};App.go=(page,query)=>navigation.push({page,query});
 bootstrap.Modal.prototype._isAnimated=()=>false;bootstrap.Offcanvas.prototype._isAnimated=()=>false;

 App.api=async(action,payload)=>{calls.push({action,payload});if(action==='Trips.monitor_details')return structuredClone(detail);if(action==='Trips.details')return {...structuredClone(detail),trip:{...trip,status:'Pending Review',intake_source:'Dispatcher'}};if(action==='Fleet.crew_save')return {id:20,message:'Fixture saved'};throw new Error('Unexpected mutation '+action);};
 const ctx={el:mount,tools,page:'dispatcher-monitoring',query:{},data:monitoring,setTitle:title=>document.querySelector('#title').textContent=title,reload(){}};
 const render=(page,query={},data=monitoring)=>{ctx.page=page;ctx.query=query;ctx.data=data;tools.innerHTML='';App.current={page,query};App.pages[page].render(ctx);};
 const closeModal=async()=>{for(const modal of [...document.querySelectorAll('.modal')]){bootstrap.Modal.getInstance(modal)?.hide();modal.querySelector('[data-unsaved-discard]')?.click();}await pause();};
 const preview=new URLSearchParams(location.search).get('preview');
 try{
  if(preview){render('dispatcher-monitoring',preview==='history'?{tab:'history'}:{},preview==='history'?{...monitoring,tab:'history',summary:{total:1,active:0,completed:1},rows:[{...trip,status:'Completed'}]}:monitoring);if(preview==='drawer')await DispatcherMonitorUI.details(1,groups);if(preview==='driver-form'||preview==='helper-form')await FleetUI.opsCrewForm({person_type:preview==='helper-form'?'Helper':'Driver'},crew);output.hidden=true;output.textContent='PREVIEW READY';return;}
  render('trips',{view:'approvals'},{can:{create:true},active:[],history:[]});assert(navigation.at(-1).query.legacy==='1'&&navigation.at(-1).query.tab==='history','Old approval bookmark redirects to read-only history');

  assert(!document.querySelector('[data-ops-section=planning]')&&!document.querySelector('[data-ops-section=approvals]'),'Separate Trip Planning and Trip Approvals navigation is retired');
  assert(document.querySelector('[data-nav=dispatcher-monitoring]'),'Dispatcher Monitoring is an authorized navigation destination');
  assert(document.querySelector('[data-ops-section=incidents]').getAttribute('href')==='#trips?tab=incidents','Incident shortcut retains Trip Management coordination');
  TripUI.data={checklist:[],fundCategories:[]};await TripUI.open(1);assert(!document.querySelector('.app-drawer [data-tact]'),'Historical request detail exposes no processing actions');UI.closeDrawer();await pause();
  render('dispatcher-monitoring');assert(document.querySelector('#title').textContent==='Dispatch Monitoring','Monitoring route renders correct title');
  assert(mount.querySelectorAll('.oh-dispatch-shift-card').length===4,'Group cards use backend groups and shifts');
  assert(mount.querySelectorAll('.record-workspace-kpis .metric').length===4&&mount.querySelectorAll('tbody tr').length===1,'Monitoring metrics and rows use returned records');
  assert(mount.querySelector('.record-workspace-tabs .active').textContent==='Active Trips','Active monitoring tab selected');
  assert(mount.querySelector('[data-monitor-prev]').disabled&&mount.querySelector('[data-monitor-next]').disabled,'Single-page workload disables paging controls');
  assert(mount.querySelectorAll('input[type=search]').length===1&&mount.querySelector('#monitor-filter-panel').hidden,'One compact search and collapsed filters');
  mount.querySelector('.record-workspace-filter-trigger').click();assert(!mount.querySelector('#monitor-filter-panel').hidden,'Monitoring filters expand');
  const form=mount.querySelector('#monitor-filter-panel');const field=key=>key==='search'?mount.querySelector('[data-monitor-search]'):form.querySelector('[name='+key+']');field('group').value='container_wingvan_dispatcher';field('shift').value='Day';field('search').value='V43';mount.querySelector('[data-monitor-search]').dispatchEvent(new Event('search'));ctx.query.search='V43';form.querySelector('[data-record-filter-apply]').click();assert(navigation.at(-1).query.group==='container_wingvan_dispatcher'&&navigation.at(-1).query.shift==='Day'&&navigation.at(-1).query.search==='V43','Apply sends backend group, shift and search filters');
  field('from').value='2026-11-12';field('to').value='2026-11-11';const before=navigation.length;form.querySelector('[data-record-filter-apply]').click();assert(navigation.length===before,'Inverted date range is rejected');
  form.querySelector('[data-record-filter-reset]').click();assert(navigation.at(-1).query.tab==='active'&&!navigation.at(-1).query.group,'Clear retains active tab');
  render('dispatcher-monitoring',{group:'container_wingvan_dispatcher',shift:'Day',search:'V43'}, {...monitoring,pages:3});mount.querySelector('[data-monitor-next]').click();assert(navigation.at(-1).query.trip_page===2&&navigation.at(-1).query.shift==='Day'&&navigation.at(-1).query.search==='V43','Server pagination retains committed filters');

  assert(drawer.textContent.includes('CM-FIX')&&drawer.textContent.includes('Verified')&&drawer.textContent.includes('Pre-Dispatch'),'Monitoring retains checklist and maintenance coordination');
  assert(!drawer.querySelector('[data-tact]')&&!drawer.querySelector('form')&&!drawer.querySelector('[data-approve]'),'Monitoring details have no operational mutations');UI.closeDrawer();await pause();
  render('dispatcher-monitoring',{tab:'history'},{...monitoring,tab:'history',rows:[],total:0});assert(mount.textContent.includes('No trips match')&&mount.querySelector('.record-workspace-tabs .active').textContent==='Trip History','History has a real empty state');
  render('crew',{},crew);assert(mount.querySelector('.record-workspace-add').textContent.includes('Add Driver')&&mount.textContent.includes('Fixture Driver')&&!mount.querySelector('.fleet-crew-workspace').textContent.includes('Fixture HelperHelper'),'Driver tab has one contextual action');
  mount.querySelector('.record-workspace-add').click();await pause();let modal=document.querySelector('.modal');assert(modal.querySelector('[name=person_type]').type==='hidden'&&modal.querySelector('[name=person_type]').value==='Driver','Driver type is determined by context');assert(modal.querySelector('[name=license_number]').required&&modal.querySelector('[name=fixed_truck_id]').required&&!modal.textContent.includes('Add Truck'),'Driver modal uses required license and existing Truck selector');
  modal.querySelector('[name=fixed_truck_id]').value='3';modal.querySelector('[name=fixed_truck_id]').dispatchEvent(new Event('change'));assert(modal.querySelector('[name=regular_helper_id]').value==='3','Existing Truck preselects its regular Helper');modal.querySelector('[name=fixed_truck_id]').value='2';modal.querySelector('[name=fixed_truck_id]').dispatchEvent(new Event('change'));assert(modal.querySelector('[name=regular_helper_id]').disabled,'Car Carrier preserves its two-driver exception');await closeModal();
  render('crew',{person_type:'Helper'},crew);assert(mount.querySelector('.record-workspace-add').textContent.includes('Add Helper')&&!mount.querySelector('.fleet-crew-workspace').textContent.includes('Fixture Driver'),'Helpers tab isolates records and contextual action');mount.querySelector('.record-workspace-add').click();await pause();modal=document.querySelector('.modal');assert(modal.querySelector('[name=person_type]').value==='Helper'&&!modal.querySelector('[name=fixed_truck_id]')&&modal.querySelector('[name=license_number]').type==='hidden','Helper modal omits Driver-only controls');await closeModal();
  assert(!calls.some(c=>['Trips.create','Trips.review','Trips.auto_assign','Trips.reassign'].includes(c.action)),'Read-only and retired workflows submit no mutations');
  App.me.user.role='motorpool';App.shell();assert(document.querySelector('[data-nav=mechanics]')&&document.querySelector('[data-nav=maintenance]'),'Maintenance role retains existing destinations');
